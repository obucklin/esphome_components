esphome:
  name: display-c3
  friendly_name: display-c3
  min_version: 2026.10.0
  on_boot:
    priority: -100
    then:
      # Draw once after HA has had time to send sensor and agenda states
      - wait_until:
          condition:
            api.connected:
          timeout: 60s
      - delay: 15s
      - component.update: epd

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

# Local driver: packs 3 pixels per byte, 128 KB buffer instead of 192 KB
external_components:
  - source:
      type: local
      path: ./components
    components: [waveshare_epaper]

logger:
  level: debug

api:
  encryption:
    key: !secret display_c3_api_key

ota:
  - platform: esphome
    password: !secret display_c3_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: True

  ap:
    ssid: "Display-Test Fallback Hotspot"
    password: !secret display_c3_ap_password


debug:
  update_interval: 5s

time:
  - platform: homeassistant
    id: ha_time
    on_time:
      # On the clock so finished events drop off the agenda promptly
      - cron: "30 0,30 * * * *"
        then:
          - component.update: epd

button:
  - platform: template
    name: "Refresh Display"
    on_press:
      - component.update: epd

text_sensor:
  - platform: debug
    device:
      name: "Device Info"
    reset_reason:
      name: "Reset Reason"
  # Both attributes come from ha_display_agenda.yaml
  - platform: homeassistant
    id: agenda_today
    entity_id: sensor.display_agenda
    attribute: today
  - platform: homeassistant
    id: agenda_tomorrow
    entity_id: sensor.display_agenda
    attribute: tomorrow

sensor:
  - platform: debug
    free:
      name: "Heap Free"
    block:
      name: "Heap Largest Block"
  - platform: sht3xd
    temperature:
      id: LRTemp
      name: "Living Room Temperature"
    humidity:
      id: LRRH
      name: "Living Room Humidity"
    address: 0x44
    update_interval: 10s
  - platform: homeassistant
    entity_id: sensor.limmat_temperature
    id: limmat_temperature
  - platform: homeassistant
    entity_id: sensor.katzensee_temperature
    id: katzensee_temperature
  # The outside values come from ha_display_agenda.yaml
  - platform: homeassistant
    entity_id: sensor.display_outside
    id: outside_temperature
  - platform: homeassistant
    entity_id: sensor.display_outside
    attribute: humidity
    id: outside_humidity
  - platform: homeassistant
    entity_id: sensor.display_outside
    attribute: high
    id: outside_high
  - platform: homeassistant
    entity_id: sensor.display_outside
    attribute: low
    id: outside_low


spi:
  clk_pin: GPIO7
  mosi_pin: GPIO21  # MOSI is required

font:
  - file: "gfonts://Antonio"
    id: lcars_big
    size: 76
    glyphs: "0123456789.-°"
  - file: "gfonts://Antonio"
    id: lcars_med
    size: 46
    glyphs: "0123456789.-°% "
  - file: "gfonts://Antonio"
    id: lcars_event
    size: 30
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Antonio"
    id: lcars_item
    size: 24
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Antonio"
    id: lcars_small
    size: 24
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:-% "

display:
  - platform: waveshare_epaper
    id: epd
    model: gdep073e01
    cs_pin: GPIO5
    dc_pin: GPIO4
    reset_pin: GPIO3
    busy_pin: GPIO6  # Low while the panel is busy; the driver handles that
    rotation: 180
    update_interval: never
    lambda: |-
      auto black = Color(0x00, 0x00, 0x00);
      auto red = Color(0xFF, 0x00, 0x00);
      auto blue = Color(0x00, 0x00, 0xFF);
      auto white = Color(0xFF, 0xFF, 0xFF);
      auto yellow = Color(0xFF, 0xFF, 0x00);

      const int margin = 8;
      const int side_w = 104;
      const int bar_h = 30;
      const int outer_r = 30;
      const int inner_r = 18;
      const int elbow_h = 72;
      const int W = it.get_width();
      const int H = it.get_height();
      const int side_x = margin;
      const int top_y = margin;
      const int bottom_y = H - margin - bar_h;
      const int list_x = 130;
      const int list_r = 524;
      const int read_x = 552;
      const int read_w = W - margin - read_x;

      auto pill = [&](int x, int y, int w, int h, Color c) {
        int r = h / 2;
        it.filled_rectangle(x + r, y, w - 2 * r, h, c);
        it.filled_circle(x + r, y + r, r, c);
        it.filled_circle(x + w - r - 1, y + r, r, c);
      };

      // Only the corner at (side_x, corner_y) is rounded; bottom mirrors top
      auto elbow = [&](int bar_y, bool bottom, Color c) {
        int block_y = bottom ? bar_y + bar_h - elbow_h : bar_y;
        it.filled_rectangle(side_x, block_y, side_w, elbow_h, c);
        int corner_y = bottom ? bar_y + bar_h - outer_r : bar_y;
        it.filled_rectangle(side_x, corner_y, outer_r, outer_r, black);
        it.filled_circle(side_x + outer_r, bottom ? corner_y : corner_y + outer_r, outer_r, c);
        int notch_x = side_x + side_w;
        int notch_y = bottom ? bar_y - inner_r : bar_y + bar_h;
        it.filled_rectangle(notch_x, notch_y, inner_r, inner_r, c);
        it.filled_circle(notch_x + inner_r, bottom ? notch_y : notch_y + inner_r, inner_r, black);
      };

      auto upper = [](char *s) {
        for (; *s; s++)
          *s = toupper(*s);
      };


      it.fill(black);

      // frame
      elbow(top_y, false, yellow);
      it.filled_rectangle(side_x + side_w, top_y, 520, bar_h, yellow);
      it.filled_rectangle(side_x + side_w + 526, top_y, 56, bar_h, red);
      pill(side_x + side_w + 588, top_y, W - margin - (side_x + side_w + 588), bar_h, blue);
      elbow(bottom_y, true, yellow);
      it.filled_rectangle(side_x + side_w, bottom_y, 360, bar_h, yellow);
      it.filled_rectangle(side_x + side_w + 366, bottom_y, 90, bar_h, blue);
      pill(side_x + side_w + 462, bottom_y, W - margin - (side_x + side_w + 462), bar_h, red);

      // sidebar: day and date, then apartment temperature and humidity
      char day_buf[8] = "--";
      char date_buf[12] = "--";
      auto now = id(ha_time).now();
      if (now.is_valid()) {
        now.strftime(day_buf, sizeof(day_buf), "%a");
        now.strftime(date_buf, sizeof(date_buf), "%d %b");
        upper(day_buf);
        upper(date_buf);
      }
      // four blocks between the elbows, 4 px apart
      const int block_y = top_y + elbow_h + 4;
      const int block_h = (bottom_y + bar_h - elbow_h - 4 - block_y - 3 * 4) / 4;
      const int text_r = side_x + side_w - 8;
      auto block = [&](int i, Color c, Color text_c, const char *text) {
        int y = block_y + i * (block_h + 4);
        it.filled_rectangle(side_x, y, side_w, block_h, c);
        it.print(text_r, y + block_h - 10, id(lcars_event), text_c, TextAlign::BASELINE_RIGHT, text);
      };
      block(0, red, white, day_buf);
      block(1, blue, white, date_buf);
      char side_buf[12];
      float temp = id(LRTemp).state;
      if (std::isnan(temp))
        snprintf(side_buf, sizeof(side_buf), "--°");
      else
        snprintf(side_buf, sizeof(side_buf), "%.1f°", temp);
      block(2, yellow, black, side_buf);
      float rh = id(LRRH).state;
      if (std::isnan(rh))
        snprintf(side_buf, sizeof(side_buf), "--%%");
      else
        snprintf(side_buf, sizeof(side_buf), "%.0f%%", rh);
      block(3, red, white, side_buf);

      // agenda: today, then tomorrow in whatever space is left
      const int row_h = 32;
      const int time_w = 80;
      const int first_row = 66;  // header top to first row baseline
      auto section = [&](int y, const char *label, text_sensor::TextSensor *src, int max_baseline) -> int {
        pill(list_x, y, list_r - list_x, 36, yellow);
        it.print(list_x + 18, y + 29, id(lcars_event), black, TextAlign::BASELINE_LEFT, label);
        const std::string &events = src->state;
        int row_y = y + first_row;
        int rows = 0;
        size_t pos = 0;
        while (pos < events.size() && row_y <= max_baseline) {
          size_t end = events.find('\n', pos);
          if (end == std::string::npos)
            end = events.size();
          size_t sep = events.find('|', pos);
          if (sep != std::string::npos && sep < end) {
            char when[12];
            char title[170];
            snprintf(when, sizeof(when), "%.*s", (int) (sep - pos), events.c_str() + pos);
            snprintf(title, sizeof(title), "%.*s", (int) (end - sep - 1), events.c_str() + sep + 1);
            it.print(list_x, row_y, id(lcars_item), yellow, TextAlign::BASELINE_LEFT, when);
            it.print(list_x + time_w, row_y, id(lcars_item), white, TextAlign::BASELINE_LEFT, title);
            row_y += row_h;
            rows++;
          }
          pos = end + 1;
        }
        if (rows == 0) {
          it.print(list_x, row_y, id(lcars_item), white, TextAlign::BASELINE_LEFT,
                   src->has_state() ? "NO SCHEDULED EVENTS" : "AWAITING DATA");
          row_y += row_h;
        }
        return row_y - row_h + 14;  // top of the next header
      };
      it.start_clipping(list_x, 0, list_r, bottom_y - 4);
      // Today stops early enough to leave the tomorrow header and one row
      int tomorrow_y = section(50, "TODAY", id(agenda_today), bottom_y - 10 - 14 - first_row);
      section(tomorrow_y, "TOMORROW", id(agenda_tomorrow), bottom_y - 10);
      it.end_clipping();

      // readouts
      it.filled_rectangle(538, 50, 4, bottom_y - 4 - 50, blue);
      auto format_temp = [](char *buf, size_t len, float value) {
        if (std::isnan(value))
          snprintf(buf, len, "--°");
        else
          snprintf(buf, len, "%.1f°", value);
      };
      char value_buf[24];
      const int read_l = read_x + 6;
      const int read_r = read_x + read_w - 6;

      // weather: current temp and humidity, then today's high and low
      const int out_y = 50;
      pill(read_x, out_y, read_w, 30, blue);
      it.print(read_x + 16, out_y + 25, id(lcars_small), white, TextAlign::BASELINE_LEFT, "WEATHER");

      format_temp(value_buf, sizeof(value_buf), id(outside_temperature).state);
      it.print(read_l, out_y + 112, id(lcars_big), yellow, TextAlign::BASELINE_LEFT, value_buf);
      float out_rh = id(outside_humidity).state;
      if (std::isnan(out_rh))
        snprintf(value_buf, sizeof(value_buf), "--%%");
      else
        snprintf(value_buf, sizeof(value_buf), "%.0f%%", out_rh);
      it.print(read_r, out_y + 80, id(lcars_small), white, TextAlign::BASELINE_RIGHT, "RH");
      it.print(read_r, out_y + 112, id(lcars_event), yellow, TextAlign::BASELINE_RIGHT, value_buf);

      it.print(read_l, out_y + 150, id(lcars_small), white, TextAlign::BASELINE_LEFT, "HIGH");
      it.print(read_r, out_y + 150, id(lcars_small), white, TextAlign::BASELINE_RIGHT, "LOW");
      format_temp(value_buf, sizeof(value_buf), id(outside_high).state);
      it.print(read_l, out_y + 200, id(lcars_med), yellow, TextAlign::BASELINE_LEFT, value_buf);
      format_temp(value_buf, sizeof(value_buf), id(outside_low).state);
      it.print(read_r, out_y + 200, id(lcars_med), yellow, TextAlign::BASELINE_RIGHT, value_buf);

      // water: Limmat justified left, Katzensee justified right
      const int water_y = 310;
      const int water_w = (read_w - 8) / 2;
      pill(read_x, water_y, water_w, 30, blue);
      it.print(read_x + 16, water_y + 25, id(lcars_small), white, TextAlign::BASELINE_LEFT, "LIMMAT");
      pill(read_x + read_w - water_w, water_y, water_w, 30, red);
      it.print(read_x + read_w - 16, water_y + 25, id(lcars_small), white, TextAlign::BASELINE_RIGHT, "KATZENSEE");
      format_temp(value_buf, sizeof(value_buf), id(limmat_temperature).state);
      it.print(read_l, water_y + 76, id(lcars_med), yellow, TextAlign::BASELINE_LEFT, value_buf);
      format_temp(value_buf, sizeof(value_buf), id(katzensee_temperature).state);
      it.print(read_r, water_y + 76, id(lcars_med), yellow, TextAlign::BASELINE_RIGHT, value_buf);

i2c:
  sda: GPIO8
  scl: GPIO20
  scan: true
  frequency: 50khz

captive_portal:
