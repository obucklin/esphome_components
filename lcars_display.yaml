esphome:
  name: display-c3
  friendly_name: display-c3
  min_version: 2026.10.0
  on_boot:
    priority: -100
    then:
      # Draw once after HA has had time to send sensor and agenda states
      - wait_until:
          condition:
            api.connected:
          timeout: 60s
      - delay: 15s
      - component.update: epd

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

# Local driver: packs 3 pixels per byte, 128 KB buffer instead of 192 KB
external_components:
  - source:
      type: local
      path: ./components
    components: [waveshare_epaper]

logger:
  level: debug

api:
  encryption:
    key: !secret display_c3_api_key

ota:
  - platform: esphome
    password: !secret display_c3_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: True

  ap:
    ssid: "Display-Test Fallback Hotspot"
    password: !secret display_c3_ap_password


debug:
  update_interval: 5s

time:
  - platform: homeassistant
    id: ha_time
    on_time:
      # On the clock so the 19:00 agenda switch from HA lands on time
      - cron: "30 0,30 * * * *"
        then:
          - component.update: epd

text_sensor:
  - platform: debug
    device:
      name: "Device Info"
    reset_reason:
      name: "Reset Reason"
  # Both attributes come from ha_display_agenda.yaml
  - platform: homeassistant
    id: agenda_events
    entity_id: sensor.display_agenda
    attribute: events
  - platform: homeassistant
    id: agenda_day
    entity_id: sensor.display_agenda
    attribute: day_label

sensor:
  - platform: debug
    free:
      name: "Heap Free"
    block:
      name: "Heap Largest Block"
  - platform: sht3xd
    temperature:
      id: LRTemp
      name: "Living Room Temperature"
    humidity:
      id: LRRH
      name: "Living Room Humidity"
    address: 0x44
    update_interval: 10s
  - platform: homeassistant
    entity_id: sensor.limmat_temperature
    id: limmat_temperature
  - platform: homeassistant
    entity_id: sensor.katzensee_temperature
    id: katzensee_temperature


spi:
  clk_pin: GPIO7
  mosi_pin: GPIO21  # MOSI is required

font:
  - file: "gfonts://Antonio"
    id: lcars_big
    size: 76
    glyphs: "0123456789.-°"
  - file: "gfonts://Antonio"
    id: lcars_med
    size: 46
    glyphs: "0123456789.-°% "
  - file: "gfonts://Antonio"
    id: lcars_event
    size: 30
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Antonio"
    id: lcars_small
    size: 24
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:- "

display:
  - platform: waveshare_epaper
    id: epd
    model: gdep073e01
    cs_pin: GPIO5
    dc_pin: GPIO4
    reset_pin: GPIO3
    busy_pin: GPIO6  # Low while the panel is busy; the driver handles that
    rotation: 180
    update_interval: never
    lambda: |-
      auto black = Color(0x00, 0x00, 0x00);
      auto red = Color(0xFF, 0x00, 0x00);
      auto blue = Color(0x00, 0x00, 0xFF);
      auto white = Color(0xFF, 0xFF, 0xFF);
      auto yellow = Color(0xFF, 0xFF, 0x00);

      const int margin = 8;
      const int side_w = 104;
      const int bar_h = 30;
      const int outer_r = 30;
      const int inner_r = 18;
      const int elbow_h = 72;
      const int W = it.get_width();
      const int H = it.get_height();
      const int side_x = margin;
      const int top_y = margin;
      const int bottom_y = H - margin - bar_h;
      const int list_x = 130;
      const int list_r = 524;
      const int read_x = 552;
      const int read_w = W - margin - read_x;

      auto pill = [&](int x, int y, int w, int h, Color c) {
        int r = h / 2;
        it.filled_rectangle(x + r, y, w - 2 * r, h, c);
        it.filled_circle(x + r, y + r, r, c);
        it.filled_circle(x + w - r - 1, y + r, r, c);
      };

      // Only the corner at (side_x, corner_y) is rounded; bottom mirrors top
      auto elbow = [&](int bar_y, bool bottom, Color c) {
        int block_y = bottom ? bar_y + bar_h - elbow_h : bar_y;
        it.filled_rectangle(side_x, block_y, side_w, elbow_h, c);
        int corner_y = bottom ? bar_y + bar_h - outer_r : bar_y;
        it.filled_rectangle(side_x, corner_y, outer_r, outer_r, black);
        it.filled_circle(side_x + outer_r, bottom ? corner_y : corner_y + outer_r, outer_r, c);
        int notch_x = side_x + side_w;
        int notch_y = bottom ? bar_y - inner_r : bar_y + bar_h;
        it.filled_rectangle(notch_x, notch_y, inner_r, inner_r, c);
        it.filled_circle(notch_x + inner_r, bottom ? notch_y : notch_y + inner_r, inner_r, black);
      };

      auto upper = [](char *s) {
        for (; *s; s++)
          *s = toupper(*s);
      };

      auto reading = [&](int y, const char *label, Color c, Color label_c, const char *value, BaseFont *font, int base) {
        pill(read_x, y, read_w, 30, c);
        it.print(read_x + 16, y + 25, id(lcars_small), label_c, TextAlign::BASELINE_LEFT, label);
        it.print(read_x + read_w / 2, y + base, font, yellow, TextAlign::BASELINE_CENTER, value);
      };

      it.fill(black);

      // frame
      elbow(top_y, false, yellow);
      it.filled_rectangle(side_x + side_w, top_y, 520, bar_h, yellow);
      it.filled_rectangle(side_x + side_w + 526, top_y, 56, bar_h, red);
      pill(side_x + side_w + 588, top_y, W - margin - (side_x + side_w + 588), bar_h, blue);
      elbow(bottom_y, true, yellow);
      it.filled_rectangle(side_x + side_w, bottom_y, 360, bar_h, yellow);
      it.filled_rectangle(side_x + side_w + 366, bottom_y, 90, bar_h, blue);
      pill(side_x + side_w + 462, bottom_y, W - margin - (side_x + side_w + 462), bar_h, red);

      // sidebar: current day, date and time of this refresh
      char day_buf[8] = "--";
      char date_buf[12] = "--";
      char upd_buf[8] = "--:--";
      auto now = id(ha_time).now();
      if (now.is_valid()) {
        now.strftime(day_buf, sizeof(day_buf), "%a");
        now.strftime(date_buf, sizeof(date_buf), "%d %b");
        now.strftime(upd_buf, sizeof(upd_buf), "%H:%M");
        upper(day_buf);
        upper(date_buf);
      }
      const int block_y = top_y + elbow_h + 4;
      const int block_h = (bottom_y + bar_h - elbow_h - 4 - block_y - 8) / 3;
      const int text_r = side_x + side_w - 8;
      it.filled_rectangle(side_x, block_y, side_w, block_h, red);
      it.print(text_r, block_y + block_h - 10, id(lcars_small), white, TextAlign::BASELINE_RIGHT, day_buf);
      it.filled_rectangle(side_x, block_y + block_h + 4, side_w, block_h, blue);
      it.print(text_r, block_y + 2 * block_h - 6, id(lcars_small), white, TextAlign::BASELINE_RIGHT, date_buf);
      it.filled_rectangle(side_x, block_y + 2 * (block_h + 4), side_w, block_h, yellow);
      it.print(text_r, block_y + 3 * block_h - 2, id(lcars_small), black, TextAlign::BASELINE_RIGHT, upd_buf);

      // agenda
      const char *day_label = id(agenda_day).has_state() ? id(agenda_day).state.c_str() : "AGENDA";
      pill(list_x, 50, list_r - list_x, 36, yellow);
      it.print(list_x + 18, 79, id(lcars_event), black, TextAlign::BASELINE_LEFT, day_label);

      const std::string &events = id(agenda_events).state;
      const int row_h = 40;
      const int time_w = 104;
      int row_y = 124;
      int rows = 0;
      size_t pos = 0;
      it.start_clipping(list_x, 90, list_r, bottom_y - 4);
      while (pos < events.size() && rows < 8) {
        size_t end = events.find('\n', pos);
        if (end == std::string::npos)
          end = events.size();
        size_t sep = events.find('|', pos);
        if (sep != std::string::npos && sep < end) {
          char when[12];
          char title[170];
          snprintf(when, sizeof(when), "%.*s", (int) (sep - pos), events.c_str() + pos);
          snprintf(title, sizeof(title), "%.*s", (int) (end - sep - 1), events.c_str() + sep + 1);
          it.print(list_x, row_y, id(lcars_event), yellow, TextAlign::BASELINE_LEFT, when);
          it.print(list_x + time_w, row_y, id(lcars_event), white, TextAlign::BASELINE_LEFT, title);
          row_y += row_h;
          rows++;
        }
        pos = end + 1;
      }
      it.end_clipping();
      if (rows == 0) {
        it.print(list_x, row_y, id(lcars_event), white, TextAlign::BASELINE_LEFT,
                 id(agenda_events).has_state() ? "NO SCHEDULED EVENTS" : "AWAITING DATA");
      }

      // readouts
      it.filled_rectangle(538, 50, 4, bottom_y - 4 - 50, blue);
      auto format_temp = [](char *buf, size_t len, float value) {
        if (std::isnan(value))
          snprintf(buf, len, "--°");
        else
          snprintf(buf, len, "%.1f°", value);
      };
      char value_buf[24];
      format_temp(value_buf, sizeof(value_buf), id(limmat_temperature).state);
      reading(50, "LIMMAT", blue, white, value_buf, id(lcars_big), 106);
      format_temp(value_buf, sizeof(value_buf), id(katzensee_temperature).state);
      reading(174, "KATZENSEE", red, white, value_buf, id(lcars_big), 106);
      float temp = id(LRTemp).state;
      float rh = id(LRRH).state;
      if (std::isnan(temp) || std::isnan(rh))
        snprintf(value_buf, sizeof(value_buf), "--°  --%%");
      else
        snprintf(value_buf, sizeof(value_buf), "%.1f°  %.0f%%", temp, rh);
      reading(298, "APARTMENT", yellow, black, value_buf, id(lcars_med), 86);

i2c:
  sda: GPIO8
  scl: GPIO20
  scan: true
  frequency: 50khz

captive_portal:
