esphome:
  name: table-lamp
  friendly_name: table_lamp
  on_boot:
    - priority: 600.0 
      then:
        - light.turn_on: 
            id: table_lamp

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: arduino

logger:

api:
  encryption:
    key: "kO+Hg9bcHgdAIUP+V0I8QRYVB8jZON01Atjwy+kFFMI="

ota:
  - platform: esphome
    password: "e3f19d8a9d5e65b2c60312c00fec12e6"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Table-Lamp Fallback Hotspot"
    password: "Nji2uNqpma90"

light:
  - platform: esp32_rmt_led_strip
    name: "table_light"
    rgb_order: GRB
    pin: GPIO10
    num_leds: 7
    rmt_channel: 0
    chipset: ws2812
    id: table_lamp
    on_turn_on:
      then:
        - light.turn_on: 
            id: table_lamp
            brightness: 100%
            red: 100%
            green: 50%
            blue: 0%
            effect: flicker
    effects:
      - addressable_flicker: 
      - addressable_twinkle: 
      - pulse: 
      - flicker:
          
    internal: false


