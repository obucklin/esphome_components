spi:
  clk_pin: GPIO7
  mosi_pin: GPIO21  # MOSI is required
  
spi_device:
  - bit_order: msb_first
    data_rate: 10MHz
    spi_mode: 0

font:
  - file: "gfonts://Orbitron"
    id: Orbitron_BIG
    size: 60

display:
  - platform: waveshare_epaper
    model: gdep073e01
    cs_pin: GPIO5
    dc_pin: GPIO4
    reset_pin: GPIO3
    busy_pin: GPIO6  # Input pin
    update_interval: 1800s 
    rotation: 0
    lambda: |-
      auto black = Color(0x00, 0x00, 0x00);
      auto red = Color(0xFF, 0x00, 0x00);
      auto green = Color(0x00, 0xFF, 0x00);
      auto blue = Color(0x00, 0x00, 0xFF);
      auto white = Color(0xFF, 0xFF, 0xFF);
      auto yellow = Color(0xFF, 0xFF, 0x00);

      Color colors[] = {black, red, green, blue, yellow};
      

      it.fill(white);

      it.print(400, 50, id(Orbitron_BIG), black, TextAlign::TOP_CENTER, "hello gdep073e01");  

      int x_pos = 130;

      for (int i=0; i<5; i++) {
        it.filled_rectangle(x_pos, 300, 100, 100, colors[i]);
        x_pos += 110;
      }

