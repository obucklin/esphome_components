  variant: esp32c3
  framework:
    type: arduino

external_components:
  - source: 
      type: local
      path: ./components
    components: [waveshare_epaper]

logger:
  level: debug

api:
  encryption:
    key: "HhpDctFSVQFcpkPbjk5ljZ3ux3IKbAY8/fft3AoJJ40="

ota:
  - platform: esphome
    password: "26cb5bd41399195a2429ea324e4139f9"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: True

  ap:
    ssid: "Display-Test Fallback Hotspot"
    password: "LZ7rZuNsLytx"  


debug:
  update_interval: 5s

text_sensor:
  - platform: debug
    device:
      name: "Device Info"
    reset_reason:
      name: "Reset Reason"

sensor:
  - platform: sht3xd
    temperature:
      id: LRTemp
      name: "Living Room Temperature"
    humidity:
      id: LRRH
      name: "Living Room Humidity"
    address: 0x44
    update_interval: 10s
  - platform: homeassistant
    entity_id: sensor.limmat_temperature
    id: limmat_temperature
  - platform: homeassistant
    entity_id: sensor.katzensee_temperature
    id: katzensee_temperature    


spi:
  clk_pin: GPIO7
  mosi_pin: GPIO21  # MOSI is required
  
spi_device:
  - bit_order: msb_first
    data_rate: 10MHz
    spi_mode: 0

font:
  - file: "gfonts://Roboto"
    id: roboto_10
    size: 30
  - file: "gfonts://Orbitron"
    id: Orbitron_30
    size: 40
  - file: "gfonts://Orbitron"
    id: Orbitron_15
    size: 15
  - file: "gfonts://Orbitron"
    id: Orbitron_BIG
    size: 100
  - file: "gfonts://Audiowide"
    id: Audiowide_BIG
    size: 80
  - file: "gfonts://Audiowide"
    id: Audiowide_small
    size: 25
  - file: "gfonts://Audiowide"
    id: Audiowide_32
    size: 35
  - file: "gfonts://Audiowide"
    id: Audiowide_med
    size: 45

display:
  - platform: waveshare_epaper
    model: gdep073e01
    cs_pin: GPIO5
    dc_pin: GPIO4
    reset_pin: GPIO3
    busy_pin: GPIO6  # Input pin
    update_interval: 1800s 
    rotation: 270
    lambda: |-
      auto black = Color(0x00, 0x00, 0x00);
      auto red = Color(0xFF, 0x00, 0x00);
      auto green = Color(0x00, 0xFF, 0x00);
      auto blue = Color(0x00, 0x00, 0xFF);
      auto white = Color(0xFF, 0xFF, 0xFF);
      auto yellow = Color(0xFF, 0xFF, 0x00);

      auto border = 5;
      auto left_y = border;
      auto right_y = border;
      auto left_width = (it.get_width() - (3*border))/2;
      auto left_x = border;
      auto right_width = it.get_width() - (3*border)-left_width;
      auto right_x = left_x + left_width + border;

      it.fill(green);
      // limmat section
      it.filled_rectangle(right_x, right_y, right_width, 160 , white);
      it.print(right_x+30, right_y+5, id(Audiowide_med), black, "Limmat");  

      int len1 = snprintf(nullptr, 0, "%.1f°", id(limmat_temperature).state);
      char *buf = new char[len1 + 1];
      snprintf(buf, len1 + 1, "%.1f°", id(limmat_temperature).state);

      it.print(right_x+(right_width/2), right_y+50, id(Audiowide_BIG),black, TextAlign::TOP_CENTER, buf);  
      right_y+=(160+border);

      // katzensee section
      it.filled_rectangle(right_x, right_y, right_width, 160 , white);
      it.print(right_x+12, right_y+5, id(Audiowide_32), black, "Katzensee");  

      int len2 = snprintf(nullptr, 0, "%.1f°", id(katzensee_temperature).state);
      char *buf2 = new char[len2 + 1];
      snprintf(buf2, len2 + 1, "%.1f°", id(katzensee_temperature).state);

      it.print(right_x+(right_width/2), right_y+50, id(Audiowide_BIG),black, TextAlign::TOP_CENTER, buf2);  
      right_y+=(160+border);

      // living room section
      it.filled_rectangle(right_x, right_y, right_width, 100 , white);
      it.print(right_x+20, right_y+5, id(Audiowide_small), black, "LIVING ROOM" );  

      float temp = id(LRTemp).state;
      float rh   = id(LRRH).state;
      int len3 = snprintf(nullptr, 0, "%.1f°  %.0f%%", temp, rh);
      char *buf3 = new char[len3 + 1];
      snprintf(buf3, len3 + 1, "%.1f°  %.0f%%", temp, rh);  

      it.print(right_x+(right_width/2), right_y+35, id(Audiowide_32), black, TextAlign::TOP_CENTER, buf3);  
      right_y+=(100+border);

      //it.filled_rectangle(it.get_width()/2+6, 280, it.get_width()-6, 100 , white);
      // it.printf(it.get_width()/2+20, 205, id(Audiowide_32), black, "%.1f°  %.0f%%", id(events)[0].start_time; 

      auto left_height = it.get_height() - (2*border);
      it.filled_rectangle(left_x, left_y, left_width, left_height, white);
      auto line_pos = left_y;
      auto time = 7;
      auto end_time = 19;
      auto line_spacing = left_height / 13;
      while (time <= end_time) {
        it.line(left_x, line_pos, left_x+left_width, line_pos, green);
        if (time%2!=0)
          it.printf(left_x+2, line_pos+2, id(Audiowide_small),black, "%d", time);      
        line_pos += line_spacing;
        time += 1;
      }

i2c:
  sda: GPIO8
  scl: GPIO20
  scan: true
  frequency: 50khz
  


